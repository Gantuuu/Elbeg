<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3c8fb8" />
    <title>Арвижих — Интернэт холболтгүй байна</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9fa; color: #183e51; font-family: system-ui, sans-serif; padding: 24px; }
      main { max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      .brand { font-size: 11px; font-weight: 700; letter-spacing: .08em; margin: 20px 0; }
      h1 { font-size: 25px; line-height: 1.25; letter-spacing: -.03em; }
      p { color: #667d89; font-size: 14px; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 999px; background: #3c8fb8; color: white; text-decoration: none; font-size: 14px; font-weight: 700; }
      a:focus-visible { outline: 3px solid #183e51; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app-192.png" alt="" />
      <div class="brand">АРВИЖИХ МАХНЫ ДЭЛГҮҮР</div>
      <h1>Интернэт холболтгүй байна</h1>
      <p>Холболтоо шалгаад дахин оролдоно уу. Бүтээгдэхүүн үзэх, захиалга хийхэд интернэт холболт шаардлагатай.</p>
      <a href="/">Дахин оролдох</a>
    </main>
  </body>
</html>
