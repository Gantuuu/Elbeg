name: D1 read budget
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:d1-reads
      - run: node --test scripts/test-order-read-migrations.cjs
      - run: node --test scripts/test-order-cache-client.cjs scripts/test-order-polling.cjs
      - run: node --test scripts/test-storefront-catalog.cjs scripts/test-public-catalog-writer.cjs
